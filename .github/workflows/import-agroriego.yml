name: Import Agroriego selected slides
on:
  push:
    paths:
      - '.github/workflows/import-agroriego.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Fetch supplied PDF and render pages 1-5 only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 'https://at.adobe.com/7m5RSsyzzVTx7zny' -o /tmp/agroriego.pdf
          pdfinfo /tmp/agroriego.pdf | grep '^Pages:'
          mkdir -p jesse-santos/public/projects/agroriego
          pdftoppm -f 1 -l 5 -r 145 -jpeg -jpegopt quality=87,progressive=y /tmp/agroriego.pdf jesse-santos/public/projects/agroriego/slide
          for n in 1 2 3 4 5; do
            source_file=$(printf 'jesse-santos/public/projects/agroriego/slide-%02d.jpg' "$n")
            target_file=$(printf 'jesse-santos/public/projects/agroriego/agro-%02d.jpg' "$n")
            test -s "$source_file"
            mv "$source_file" "$target_file"
          done
          rm -f /tmp/agroriego.pdf
      - name: Commit just the five slides
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jesse-santos/public/projects/agroriego/agro-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add five Agroriego presentation slides"
            git push
          fi
